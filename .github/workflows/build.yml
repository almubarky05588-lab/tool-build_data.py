name: بناء التطبيق

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تجهيز بيانات المصحف والمتشابهات
        run: |
          pip install fonttools
          python3 tool/build_data.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: إنشاء مجلدات المنصات (android/ios)
        run: |
          flutter create . --platforms=android,ios --org sa.almubarky --project-name albayan
          # اسم التطبيق الظاهر على الجهاز
          sed -i 's/android:label="albayan"/android:label="البيان"/' android/app/src/main/AndroidManifest.xml
          pip install pillow
          python3 tool/apply_icons.py android

      - name: تحليل الكود
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: الاختبارات ورسم صفحات للتحقق البصري
        run: flutter test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-screens
          path: build/screens/
          retention-days: 14

      - name: نشر صور الصفحات في فرع screens للمراجعة
        if: always()
        run: |
          [ -d build/screens ] || exit 0
          cd build/screens
          git init -q -b screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "صور الصفحات ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screens

      - name: بناء APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: albayan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
