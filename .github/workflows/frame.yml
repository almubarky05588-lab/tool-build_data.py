# تنزيل ملفات مصحف المدينة الرسمية (مجمع الملك فهد) لاقتطاع الإطار والزخارف.
# يُشغَّل يدويًا. النتائج تُرفع إلى فرع frame.
name: frame
on:
  workflow_dispatch:
    inputs:
      files:
        description: "أسماء ملفات من الأرشيف للتنزيل (مفصولة بفاصلة)، فارغ = القائمة فقط"
        required: false
        default: ""
      ai_pages:
        description: "أرقام صفحات تُستخرج من ملفات Illustrator (مثل 1,2,50)"
        required: false
        default: ""
      pdf_pages:
        description: "أرقام صفحات PDF تُرسم صورًا"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: القائمة والتنزيل
        env:
          FILES: ${{ inputs.files }}
        run: |
          mkdir -p out
          ID=MushafMadinaHafsGreen1441
          curl -sL "https://archive.org/metadata/$ID" -o out/metadata.json
          python3 - <<'PY'
          import json
          m=json.load(open('out/metadata.json'))
          with open('out/files.txt','w') as f:
              for x in m.get('files',[]):
                  f.write(f"{x.get('name')}\t{x.get('size','')}\t{x.get('format','')}\n")
          PY
          IFS=',' read -ra FS <<< "$FILES"
          for f in "${FS[@]}"; do
            [ -z "$f" ] && continue
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$f")
            curl -sL --fail "https://archive.org/download/$ID/$enc" -o "out/$(basename "$f")" || echo "فشل: $f"
          done
          ls -la out
      - name: ملفات Illustrator — استخراج صفحات مختارة
        if: ${{ inputs.ai_pages != '' }}
        env:
          PAGES: ${{ inputs.ai_pages }}
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          curl -sL --fail "https://archive.org/download/MushafMadinaHafsGreen1441/1441-AI-hafs.zip" -o /tmp/ai.zip
          python3 - <<'PY'
          import os, re, zipfile
          z = zipfile.ZipFile('/tmp/ai.zip')
          names = z.namelist()
          open('out/ai_list.txt', 'w').write('\n'.join(names))
          want = {int(p) for p in os.environ['PAGES'].split(',') if p.strip()}
          os.makedirs('out/ai', exist_ok=True)
          for n in names:
              base = os.path.basename(n)
              nums = [int(x) for x in re.findall(r'\d+', base)]
              if base and nums and nums[0] in want:
                  data = z.read(n)
                  dest = 'out/ai/' + base
                  open(dest, 'wb').write(data)
                  print('استُخرج', n, len(data))
          PY
          cd out/ai
          for f in *; do
            stem="${f%.*}"
            pdftocairo -png -r 110 -singlefile "$f" "$stem" || echo "تعذّر PNG: $f"
            pdftocairo -svg "$f" "$stem.svg" || echo "تعذّر SVG: $f"
          done
          ls -la
      - name: صفحات من PDF الممسوح
        if: ${{ inputs.pdf_pages != '' }}
        env:
          PAGES: ${{ inputs.pdf_pages }}
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          curl -sL --fail "https://archive.org/download/MushafMadinaHafsGreen1441/MushafMadinaHafsGreen1441.pdf" -o /tmp/m.pdf
          pdfinfo /tmp/m.pdf | tee out/pdfinfo.txt
          mkdir -p out/pdf
          IFS=',' read -ra PS <<< "$PAGES"
          for n in "${PS[@]}"; do pdftoppm -f "$n" -l "$n" -r 90 -png /tmp/m.pdf "out/pdf/p$n"; done
          ls -la out/pdf
      - name: رفع إلى فرع frame
        run: |
          cd out
          git init -q -b frame
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          find . -size +95M -delete
          git add -A && git commit -qm "frame files"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" frame
